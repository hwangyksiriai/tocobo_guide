<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCOBO 가이드라인 관리</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
            background: #f4f4f4;
            color: #1a1a1a;
            -webkit-tap-highlight-color: transparent;
        }

        .admin-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .admin-logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.3em;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .admin-sub {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 48px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            max-width: 600px;
        }

        .page-card {
            background: #fff;
            border-radius: 18px;
            padding: 32px 24px;
            text-decoration: none;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.18s, box-shadow 0.18s;
            position: relative;
            overflow: hidden;
        }

        .page-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.1);
        }

        .page-card.reels { border-top: 4px solid #1a1a1a; }
        .page-card.feed  { border-top: 4px solid #888; }

        .card-type {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #aaa;
        }

        .card-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.05em;
            line-height: 1.2;
        }

        .card-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.6;
        }

        .card-arrow {
            font-size: 20px;
            color: #ccc;
            margin-top: 8px;
        }

        .admin-footer {
            margin-top: 40px;
            font-size: 11px;
            color: #bbb;
            letter-spacing: 0.08em;
        }

        @media (max-width: 480px) {
            .card-grid { grid-template-columns: 1fr; max-width: 360px; }
            .card-title { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="admin-wrap">
    <div class="admin-logo">TOCOBO</div>
    <div class="admin-sub">Influencer Guideline Manager</div>

    <div class="card-grid">
        <a class="page-card reels" href="reels.html">
            <div class="card-type">콘텐츠 타입</div>
            <div class="card-title">Reels</div>
            <div class="card-desc">릴스 콘텐츠 제작<br>인플루언서용 가이드라인</div>
            <div class="card-arrow">→</div>
        </a>
        <a class="page-card feed" href="feed.html">
            <div class="card-type">콘텐츠 타입</div>
            <div class="card-title">Feed</div>
            <div class="card-desc">피드 콘텐츠 제작<br>인플루언서용 가이드라인</div>
            <div class="card-arrow">→</div>
        </a>
    </div>

    <div class="admin-footer">TOCOBO × IN MY SUN ERA in 성수 🌞</div>
</div>

</body>
</html>
